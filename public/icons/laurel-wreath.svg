<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Define single branch on left, then mirror for right -->
  <defs>
    <g id="laurel-branch">
      <!-- Main stem arc -->
      <path d="M 190 280 C 120 270, 70 210, 70 140 C 70 85, 110 35, 175 20" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Leaf Pairs ascending along the curve -->
      <!-- Pair 1 (Bottom) -->
      <path d="M 175 272 C 160 280, 145 282, 135 278 C 145 270, 160 268, 175 272 Z" fill="currentColor"/>
      <path d="M 160 276 C 145 288, 130 292, 120 286 C 132 278, 148 274, 160 276 Z" fill="currentColor"/>

      <!-- Pair 2 -->
      <path d="M 140 250 C 120 260, 102 260, 95 252 C 108 244, 126 244, 140 250 Z" fill="currentColor"/>
      <path d="M 125 254 C 105 268, 88 270, 80 260 C 95 250, 112 248, 125 254 Z" fill="currentColor"/>

      <!-- Pair 3 -->
      <path d="M 110 220 C 90 230, 72 226, 66 216 C 80 210, 98 212, 110 220 Z" fill="currentColor"/>
      <path d="M 96 222 C 74 234, 58 232, 52 220 C 68 212, 84 214, 96 222 Z" fill="currentColor"/>

      <!-- Pair 4 -->
      <path d="M 88 180 C 68 188, 52 180, 48 168 C 62 165, 78 170, 88 180 Z" fill="currentColor"/>
      <path d="M 75 180 C 54 188, 38 182, 34 168 C 50 164, 65 170, 75 180 Z" fill="currentColor"/>

      <!-- Pair 5 (Middle curve) -->
      <path d="M 74 140 C 56 142, 42 132, 40 120 C 54 120, 67 128, 74 140 Z" fill="currentColor"/>
      <path d="M 64 136 C 44 136, 30 124, 28 110 C 44 112, 56 122, 64 136 Z" fill="currentColor"/>

      <!-- Pair 6 -->
      <path d="M 75 100 C 60 98, 48 85, 50 72 C 63 76, 72 88, 75 100 Z" fill="currentColor"/>
      <path d="M 68 94 C 50 88, 40 74, 44 60 C 58 66, 66 80, 68 94 Z" fill="currentColor"/>

      <!-- Pair 7 -->
      <path d="M 90 64 C 80 56, 72 40, 78 28 C 90 36, 94 50, 90 64 Z" fill="currentColor"/>
      <path d="M 86 56 C 72 46, 68 30, 76 18 C 88 28, 90 44, 86 56 Z" fill="currentColor"/>

      <!-- Pair 8 (Top apex) -->
      <path d="M 120 36 C 114 24, 112 8, 124 2 C 130 14, 130 28, 120 36 Z" fill="currentColor"/>
      <path d="M 124 28 C 118 14, 120 0, 132 -4 C 136 10, 134 22, 124 28 Z" fill="currentColor"/>

      <!-- Tip Leaf -->
      <path d="M 160 22 C 160 8, 168 -4, 180 -6 C 180 8, 174 18, 160 22 Z" fill="currentColor"/>
    </g>
  </defs>

  <!-- Left Wreath Branch -->
  <use href="#laurel-branch" color="currentColor" />

  <!-- Right Wreath Branch (Mirrored around center X = 200) -->
  <use href="#laurel-branch" transform="translate(400, 0) scale(-1, 1)" color="currentColor" />
</svg>

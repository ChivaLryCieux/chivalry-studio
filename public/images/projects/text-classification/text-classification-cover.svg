<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#0A0F18"/>
  
  <!-- Outer Swiss Framing Grid -->
  <rect x="80" y="80" width="1440" height="740" stroke="#1E293B" stroke-width="2"/>
  <rect x="80" y="80" width="1440" height="130" fill="#0F172A"/>
  <line x1="80" y1="210" x2="1520" y2="210" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Section -->
  <rect x="120" y="118" width="54" height="54" fill="#3B82F6"/>
  <text x="194" y="158" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="2">TEXT CLASSIFICATION</text>
  <text x="1100" y="156" fill="#60A5FA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="1">AUTUMN 2024 / NLP BENCHMARK</text>

  <!-- Left Content Area -->
  <text x="120" y="300" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900">文本分类实验</text>
  <text x="120" y="365" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">从词频统计到预训练模型</text>
  <text x="120" y="420" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500">TF-IDF · Word2Vec · TextCNN · BiLSTM · BERT</text>

  <rect x="120" y="455" width="480" height="2" fill="#3B82F6"/>

  <!-- Left Metadata -->
  <text x="120" y="500" fill="#38BDF8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="1">NLP EVOLUTION STUDY</text>
  <text x="120" y="535" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">特征工程 vs 深度语义 vs 迁移学习微调</text>
  <text x="120" y="570" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400">Systematic benchmarking across standardized text corpora</text>

  <!-- Spec Badges -->
  <g transform="translate(120, 620)">
    <rect x="0" y="0" width="160" height="56" fill="#111C2D" stroke="#1E3A5F" stroke-width="1"/>
    <text x="18" y="24" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">BASELINE</text>
    <text x="18" y="44" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">TF-IDF / BoW</text>

    <rect x="176" y="0" width="160" height="56" fill="#111C2D" stroke="#1E3A5F" stroke-width="1"/>
    <text x="194" y="24" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">DEEP LEARNING</text>
    <text x="194" y="44" fill="#38BDF8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">CNN / LSTM</text>

    <rect x="352" y="0" width="160" height="56" fill="#111C2D" stroke="#1E3A5F" stroke-width="1"/>
    <text x="370" y="24" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">TRANSFORMER</text>
    <text x="370" y="44" fill="#60A5FA" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">BERT / RoBERTa</text>
  </g>

  <text x="120" y="750" fill="#475569" font-family="Courier New, monospace" font-size="16">INDEX: #02 // NATURAL LANGUAGE PROCESSING BENCHMARK</text>

  <!-- Right Paradigm Evolution Diagram -->
  <g transform="translate(760, 260)">
    <!-- Boundary Box -->
    <rect x="0" y="0" width="680" height="490" fill="#0C1420" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Stage 1: Sparse TF-IDF (Bar histogram) -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="170" height="340" fill="#101B2C" stroke="#1E3A5F" stroke-width="1"/>
      <text x="15" y="30" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">01. STATISTICAL</text>
      <text x="15" y="50" fill="#64748B" font-family="Courier New, monospace" font-size="11">Sparse TF-IDF</text>
      
      <!-- Bars -->
      <rect x="25" y="230" width="16" height="80" fill="#334155"/>
      <rect x="49" y="190" width="16" height="120" fill="#3B82F6"/>
      <rect x="73" y="260" width="16" height="50" fill="#334155"/>
      <rect x="97" y="140" width="16" height="170" fill="#60A5FA"/>
      <rect x="121" y="210" width="16" height="100" fill="#334155"/>
      <line x1="15" y1="310" x2="155" y2="310" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Arrow 1 -->
    <path d="M225 220 L245 220" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Stage 2: Deep Embeddings (Dense sequence vector) -->
    <g transform="translate(255, 50)">
      <rect x="0" y="0" width="170" height="340" fill="#101B2C" stroke="#1E3A5F" stroke-width="1"/>
      <text x="15" y="30" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">02. DEEP NEURAL</text>
      <text x="15" y="50" fill="#64748B" font-family="Courier New, monospace" font-size="11">CNN / LSTM Embeds</text>

      <!-- Latent vector cells -->
      <rect x="35" y="90" width="100" height="25" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
      <rect x="35" y="125" width="100" height="25" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1"/>
      <rect x="35" y="160" width="100" height="25" fill="#2563EB" stroke="#93C5FD" stroke-width="1"/>
      <rect x="35" y="195" width="100" height="25" fill="#1E3A5F" stroke="#60A5FA" stroke-width="1"/>
      <rect x="35" y="230" width="100" height="25" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>

      <line x1="85" y1="265" x2="85" y2="300" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="85" cy="305" r="4" fill="#38BDF8"/>
    </g>

    <!-- Arrow 2 -->
    <path d="M440 220 L460 220" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Stage 3: Transformers (Self-Attention Map) -->
    <g transform="translate(470, 50)">
      <rect x="0" y="0" width="170" height="340" fill="#101B2C" stroke="#2563EB" stroke-width="1.5"/>
      <text x="15" y="30" fill="#60A5FA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">03. PRETRAINED</text>
      <text x="15" y="50" fill="#38BDF8" font-family="Courier New, monospace" font-size="11">BERT Transformers</text>

      <!-- Multi-Head Attention Grid -->
      <g transform="translate(25, 95)">
        <rect x="0" y="0" width="26" height="26" fill="#1E3A5F"/>
        <rect x="30" y="0" width="26" height="26" fill="#2563EB"/>
        <rect x="60" y="0" width="26" height="26" fill="#1E293B"/>
        <rect x="90" y="0" width="26" height="26" fill="#60A5FA"/>

        <rect x="0" y="30" width="26" height="26" fill="#3B82F6"/>
        <rect x="30" y="30" width="26" height="26" fill="#93C5FD"/>
        <rect x="60" y="30" width="26" height="26" fill="#2563EB"/>
        <rect x="90" y="30" width="26" height="26" fill="#1E3A5F"/>

        <rect x="0" y="60" width="26" height="26" fill="#1E293B"/>
        <rect x="30" y="60" width="26" height="26" fill="#3B82F6"/>
        <rect x="60" y="60" width="26" height="26" fill="#38BDF8"/>
        <rect x="90" y="60" width="26" height="26" fill="#2563EB"/>

        <rect x="0" y="90" width="26" height="26" fill="#60A5FA"/>
        <rect x="30" y="90" width="26" height="26" fill="#1E3A5F"/>
        <rect x="60" y="90" width="26" height="26" fill="#2563EB"/>
        <rect x="90" y="90" width="26" height="26" fill="#93C5FD"/>
      </g>

      <text x="25" y="260" fill="#38BDF8" font-family="Courier New, monospace" font-size="11">ATTN: MULTI-HEAD</text>
      <text x="25" y="280" fill="#94A3B8" font-family="Courier New, monospace" font-size="11">LAYERS: 12-L 768-H</text>
    </g>

    <!-- Bottom Metric Bar -->
    <text x="40" y="445" fill="#64748B" font-family="Courier New, monospace" font-size="13">PARADIGM: STATISTICAL → RECURRENT / CONV → SELF-ATTENTION</text>
    <text x="540" y="445" fill="#60A5FA" font-family="Courier New, monospace" font-size="13">ACC: +18.4%</text>
  </g>
</svg>
